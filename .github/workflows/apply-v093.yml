name: Apply Good King V0.9.3

on:
  push:
    branches: [release-v0.9.3]
    paths:
      - '.github/workflows/apply-v093.yml'
      - 'tools/apply_v093.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          ref: release-v0.9.3
          fetch-depth: 0

      - name: Apply V0.9.3
        run: python tools/apply_v093.py

      - name: Validate JavaScript, manifest and local-first safety
        run: |
          node --check app.js
          node --check config.js
          node --check v06.js
          node --check v07.js
          node --check v08.js
          node --check v09.js
          node --check v092.js
          node --check v093.js
          node --check sw.js
          node --check vendor/supabase-lite.js
          python - <<'PY'
          import json,re
          from pathlib import Path
          json.load(open('manifest.webmanifest'))
          assert json.load(open('version.json'))['version']=='0.9.3'
          html=Path('index.html').read_text()
          ids=re.findall(r'\bid="([^"]+)"',html)
          assert len(ids)==len(set(ids)), 'HTML contiene IDs duplicados'
          app=Path('app.js').read_text()
          assert "const DB_VERSION = 8;" in app
          assert 'deleteDatabase' not in ''.join(p.read_text(errors='ignore') for p in Path('.').glob('*.js'))
          assert 'v093.js?v=0.9.3' in html
          assert 'good-king-v093-shell' in Path('sw.js').read_text()
          print('Validación V0.9.3 OK; goodKingDB permanece v8')
          PY

      - name: Regenerate checksums and commit validated release
        run: |
          find . -type f ! -path './.git/*' ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt
          git config user.name 'Good King Release Bot'
          git config user.email 'good-king-release@users.noreply.github.com'
          git rm tools/apply_v093.py .github/workflows/apply-v093.yml
          git add app.js config.js styles.css index.html version.json manifest.webmanifest sw.js v093.js CHANGELOG.md SHA256SUMS.txt
          git diff --cached --check
          git commit -m 'Good King V0.9.3: catálogo visual y pedido móvil'
          git push origin HEAD:release-v0.9.3
