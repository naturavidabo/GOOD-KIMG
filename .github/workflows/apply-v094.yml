name: Apply Good King V0.9.4

on:
  push:
    branches: [release-v0.9.4]
    paths:
      - '.github/workflows/apply-v094.yml'
      - 'tools/apply_v094.py'
      - 'v094.js'
      - 'v094.css'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          ref: release-v0.9.4
          fetch-depth: 0
      - name: Apply V0.9.4
        run: python tools/apply_v094.py
      - name: Validate release
        run: |
          node --check app.js
          node --check v06.js
          node --check v07.js
          node --check v08.js
          node --check v09.js
          node --check v092.js
          node --check v093.js
          node --check v094.js
          node --check sw.js
          node --check vendor/supabase-lite.js
          python - <<'PY'
          import json,re
          from pathlib import Path
          assert json.load(open('version.json'))['version']=='0.9.4'
          json.load(open('manifest.webmanifest'))
          html=Path('index.html').read_text()
          ids=re.findall(r'\bid="([^"]+)"',html)
          assert len(ids)==len(set(ids))
          assert 'v094.js?v=0.9.4' in html and 'v094.css?v=0.9.4' in html
          assert "const DB_VERSION = 8;" in Path('app.js').read_text()
          assert 'deleteDatabase' not in ''.join(p.read_text(errors='ignore') for p in Path('.').glob('*.js'))
          assert 'good-king-v094-shell' in Path('sw.js').read_text()
          print('Good King V0.9.4 validada; IndexedDB v8 preservada')
          PY
      - name: Commit validated release
        run: |
          find . -type f ! -path './.git/*' ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt
          git config user.name 'Good King Release Bot'
          git config user.email 'good-king-release@users.noreply.github.com'
          git rm tools/apply_v094.py .github/workflows/apply-v094.yml
          git add index.html sw.js version.json manifest.webmanifest CHANGELOG.md v094.js v094.css SHA256SUMS.txt
          git diff --cached --check
          git commit -m 'Good King V0.9.4: caja, tickets y mercado automático'
          git push origin HEAD:release-v0.9.4
